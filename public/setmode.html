<!doctype html>
<html>
<head><meta charset="utf-8"><title>mode setter</title></head>
<body style="margin:0">
<iframe id="f" src="/" style="width:100vw;height:100vh;border:0;display:block"></iframe>
<script>
  localStorage.setItem('portfolio-mode', 'car');
  var f = document.getElementById('f');
  setTimeout(function () { f.contentWindow.scrollTo(0, 2900); }, 6000);
  setTimeout(function () { f.contentWindow.scrollTo(0, 2900); }, 12000);
  setTimeout(function () { f.contentWindow.scrollTo(0, 2900); }, 20000);
</script>
</body>
</html>
